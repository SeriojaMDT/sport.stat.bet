name: Build BestSportStats V2.2 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply BestSportStats V2.2 source
        run: python tools/apply_v21_source.py
      - name: Set V2.2 version
        run: |
          sed -i "s/versionCode [0-9][0-9]*/versionCode 8/" app/build.gradle
          sed -i "s/versionName '[^']*'/versionName '2.2-test'/" app/build.gradle
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload V2.2 source
        uses: actions/upload-artifact@v4
        with:
          name: bestsportstats-v22-source
          path: app/src/main/java/com/serghei/footballpredictions/MainActivity.java
          if-no-files-found: error
      - name: Upload V2.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: bestsportstats-v22-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
