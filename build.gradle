plugins {
    id 'com.android.application' version '8.8.2' apply false
}

// Goals Stats v1.2 patch. GitHub Actions has already unpacked the Goals Stats
// overlay and applied the v1.1 redesign before Gradle starts, so patch the
// generated files now, before the :app project is evaluated.
def javaFile = file('app/src/main/java/com/serghei/footballpredictions/MainActivity.java')
if (!javaFile.exists()) {
    throw new GradleException('Goals Stats MainActivity.java was not found')
}

def source = javaFile.getText('UTF-8')
def pattern = ~/(?s)(?:static\s+final\s+)?String\[\]\s+BLOGGER_URLS\s*=\s*(?:new\s+String\[\]\s*)?\{.*?\};/
def replacement = '''static final String[] BLOGGER_URLS = {
    "https://www.bestsportstats.com/p/bssgoalsenglandpremierleague2024.html"
};'''

if (!(source =~ pattern).find()) {
    throw new GradleException('BLOGGER_URLS declaration was not found in Goals Stats source')
}

source = source.replaceFirst(pattern, replacement)
javaFile.write(source, 'UTF-8')

def appGradle = file('app/build.gradle')
if (!appGradle.exists()) {
    throw new GradleException('app/build.gradle was not found')
}

def appText = appGradle.getText('UTF-8')
appText = appText.replace('versionCode 2', 'versionCode 3')
                 .replace("versionName '1.1-test'", "versionName '1.2-test'")
appGradle.write(appText, 'UTF-8')
