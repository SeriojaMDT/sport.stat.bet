name: Build Football Stats Analyzer V4.0.5 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-v405:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare V4.0.5 source
        run: bash tools/prepare_v405.sh
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload V4.0.5 source
        uses: actions/upload-artifact@v4
        with:
          name: football-stats-analyzer-v405-source
          path: app/src/main/java/com/serghei/footballpredictions/MainActivity.java
          if-no-files-found: error
      - name: Upload V4.0.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: football-stats-analyzer-v405-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
