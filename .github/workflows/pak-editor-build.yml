name: Build PAK Visual Editor

on:
  push:
    branches:
      - chatgpt-pak-editor-build
    paths:
      - 'pak-editor-build/**'
      - '.github/workflows/pak-editor-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.2.1 Android AES fix and simpler UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('pak-editor-build')

          # Header/index validation: avoid Android OpenSSL PKCS5Padding BAD_DECRYPT.
          p = root / 'app/src/main/java/com/pakvisualeditor/core/PakV14HeaderDecoder.kt'
          s = p.read_text()
          pattern = r'val decoded = if \(h\.encryptedIndex\) \{\s*val cipher = Cipher\.getInstance\("AES/CBC/PKCS5Padding"\)\s*cipher\.init\(Cipher\.DECRYPT_MODE, SecretKeySpec\(aesKey, "AES"\), IvParameterSpec\(aesIv\)\)\s*cipher\.doFinal\(encryptedBytes\)\s*\} else encryptedBytes'
          s, n = re.subn(pattern, 'val decoded = if (h.encryptedIndex) decryptIndex(encryptedBytes) else encryptedBytes', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Header AES patch did not match')
          anchor = '    private fun u32le(data: ByteArray, offset: Int): Long ='
          helper = '''    private fun decryptIndex(enc: ByteArray): ByteArray {
              require(enc.isNotEmpty() && enc.size % 16 == 0) { "Encrypted index size is not AES aligned" }
              val cipher = Cipher.getInstance("AES/CBC/NoPadding")
              cipher.init(Cipher.DECRYPT_MODE, SecretKeySpec(aesKey, "AES"), IvParameterSpec(aesIv))
              val padded = cipher.doFinal(enc)
              val pad = padded.last().toInt() and 0xFF
              require(pad in 1..16 && pad <= padded.size && padded.takeLast(pad).all { (it.toInt() and 0xFF) == pad }) {
                  "Index decrypted, but PKCS#7 padding is invalid"
              }
              return padded.copyOf(padded.size - pad)
          }

          '''
          if anchor not in s:
              raise SystemExit('Header helper anchor missing')
          s = s.replace(anchor, helper + anchor, 1)
          p.write_text(s)

          # Full archive parse/rebuild uses the same manual PKCS#7 handling.
          p = root / 'app/src/main/java/com/pakvisualeditor/core/PakV14Archive.kt'
          s = p.read_text()
          pattern = r'\s*private fun decryptIndex\(enc:ByteArray\):ByteArray \{.*?\}\s*private fun encryptIndex\(plain:ByteArray\):ByteArray \{.*?\}'
          replacement = '''
              private fun decryptIndex(enc:ByteArray):ByteArray {
                  require(enc.isNotEmpty() && enc.size % 16 == 0) { "Encrypted index size is not AES aligned" }
                  val c=Cipher.getInstance("AES/CBC/NoPadding")
                  c.init(Cipher.DECRYPT_MODE,SecretKeySpec(aesKey,"AES"),IvParameterSpec(aesIv))
                  val padded=c.doFinal(enc)
                  val pad=padded.last().toInt() and 0xFF
                  require(pad in 1..16 && pad<=padded.size && padded.takeLast(pad).all{(it.toInt() and 0xFF)==pad}) { "Index decrypted, but PKCS#7 padding is invalid" }
                  return padded.copyOf(padded.size-pad)
              }
              private fun encryptIndex(plain:ByteArray):ByteArray {
                  val pad=16-(plain.size%16)
                  val padded=plain.copyOf(plain.size+pad)
                  for(i in plain.size until padded.size) padded[i]=pad.toByte()
                  val c=Cipher.getInstance("AES/CBC/NoPadding")
                  c.init(Cipher.ENCRYPT_MODE,SecretKeySpec(aesKey,"AES"),IvParameterSpec(aesIv))
                  return c.doFinal(padded)
              }'''
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Archive AES patch did not match')
          p.write_text(s)

          # Clear old selection before opening a new file so stale errors/cards cannot remain.
          p = root / 'app/src/main/java/com/pakvisualeditor/MainActivity.kt'
          s = p.read_text()
          s = s.replace(
              'lastBuilt = null\n                progress = 5',
              'lastBuilt = null\n                sourceFile = null\n                inspection = null\n                indexValidation = null\n                archiveValidation = null\n                progress = 5',
              1
          )
          # Store the newly selected file/header before AES/full validation.
          s = s.replace(
              'val info = withContext(Dispatchers.IO) { PakHeaderInspector.inspect(local) }\n                    val idx =',
              'val info = withContext(Dispatchers.IO) { PakHeaderInspector.inspect(local) }\n                    sourceFile = local\n                    inspection = info\n                    val idx =',
              1
          )
          s = s.replace('                    sourceFile = local\n                    inspection = info\n                    indexValidation = idx', '                    indexValidation = idx', 1)

          simple = {
              'Open a PAK to begin': 'Apasă Deschide PAK și alege fișierul .pak',
              'Offline v4.6 test editor': 'Editor offline v4.6',
              'Open PAK': 'Deschide PAK',
              'Visual profile': '2. Alege profilul',
              'Keep source': 'Păstrează sursa',
              'English — original layout': 'Engleză — aspect original',
              'English — clean + raised HUD': 'Engleză — curat + HUD ridicat',
              'Neutralize auxiliary branding': 'Neutralizează brandingul auxiliar',
              'HUD preview': 'Previzualizare HUD',
              'Build & Validate PAK': 'Construiește și verifică PAK',
              'Save PAK to phone': 'Salvează PAK în telefon',
              'Output ready': 'Fișier gata',
              'Open failed': 'Deschiderea a eșuat',
              'PAK ready': 'PAK pregătit',
          }
          for a,b in simple.items():
              s = s.replace(a,b)

          # Translate only the visible heading, never identifiers such as canBuild.
          s = s.replace('Text("Build", style = MaterialTheme.typography.titleLarge)', 'Text("3. Construiește", style = MaterialTheme.typography.titleLarge)', 1)

          marker = 'Text("Editor offline v4.6", style = MaterialTheme.typography.bodyMedium)'
          if marker in s and '1. Alege fișierul .pak' not in s:
              s = s.replace(marker, marker + '\n\n        Text("1. Alege fișierul .pak", style = MaterialTheme.typography.titleMedium)', 1)

          s = re.sub(
              r'\n\s*HorizontalDivider\(\)\s*\n\s*Text\("Profile JSON".*?\n\s*Text\(profile\.toJson\(\).*?\n\s*Text\("This editor does not include anti-cheat bypass or detection-evasion features\.".*?\n',
              '\n        HorizontalDivider()\n        Text("Cum îl folosești", style = MaterialTheme.typography.titleMedium)\n        Text("Deschide PAK → alege profilul → construiește → salvează.", style = MaterialTheme.typography.bodySmall)\n',
              s,
              count=1,
              flags=re.S
          )
          p.write_text(s)

          p = root / 'app/build.gradle.kts'
          s = p.read_text().replace('versionCode = 2', 'versionCode = 3').replace('versionName = "0.2.0-test"', 'versionName = "0.2.1-test"')
          p.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: pak-editor-build
        run: gradle --no-daemon assembleRelease

      - name: Collect APK and signing tools
        run: |
          mkdir -p packaged
          cp pak-editor-build/app/build/outputs/apk/release/app-release-unsigned.apk packaged/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" packaged/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" packaged/
          chmod +x packaged/zipalign

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pak-editor-build-output-v021
          path: packaged/
          if-no-files-found: error
