plugins {
    id 'com.android.application'
}

android {
    namespace 'com.serghei.footballpredictions'
    compileSdk 35

    defaultConfig {
        applicationId 'com.serghei.footballpredictions'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '2.0-test'
    }

    signingConfigs {
        testKey {
            storeFile file('football-test-key.jks')
            storePassword 'footballtest123'
            keyAlias 'footballtest'
            keyPassword 'footballtest123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.testKey
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.testKey
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
