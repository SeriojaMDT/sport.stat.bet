name: Build Football Stats Analyzer V4.1.0 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-v410:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare V4.1.0 source
        run: bash tools/prepare_v410.sh
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload V4.1.0 source
        uses: actions/upload-artifact@v4
        with:
          name: football-stats-analyzer-v410-source
          path: app/src/main/java/com/serghei/footballpredictions/MainActivity.java
          if-no-files-found: error
      - name: Upload V4.1.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: football-stats-analyzer-v410-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
