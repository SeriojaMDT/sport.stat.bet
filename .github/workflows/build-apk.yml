name: Build Goals Stats APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply Goals Stats source overlay
        run: |
          cat goals-overlay.b64.part1 goals-overlay.b64.part2 goals-overlay.b64.part3 goals-overlay.b64.part4 goals-overlay.b64.part5 goals-overlay.b64.part6 | base64 -d > /tmp/goals-overlay.zip
          unzip -t /tmp/goals-overlay.zip
          unzip -o /tmp/goals-overlay.zip
      - name: Apply v1.1 redesign
        run: python tools/patch_goals_v11.py
      - name: Apply v1.3 compact stats redesign
        run: python tools/run_goals_v13.py
      - name: Apply v1.4 multi-league index
        run: python tools/patch_goals_v14.py
      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: goals-stats-v14-source
          path: app/src/main/java/com/serghei/footballpredictions/MainActivity.java
          if-no-files-found: error
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: goals-stats-v14-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
