name: Build PAK Visual Editor

on:
  push:
    branches:
      - chatgpt-pak-editor-build
    paths:
      - 'pak-editor-build/**'
      - '.github/workflows/pak-editor-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: pak-editor-build
        run: gradle --no-daemon assembleRelease

      - name: Collect APK and signing tools
        run: |
          mkdir -p packaged
          cp pak-editor-build/app/build/outputs/apk/release/app-release-unsigned.apk packaged/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" packaged/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" packaged/
          chmod +x packaged/zipalign

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pak-editor-build-output
          path: packaged/
          if-no-files-found: error
